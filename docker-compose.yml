# yaml
version: "3.9"

services:
  api:
    build: .
    container_name: epilanka-api
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/epilanka
    depends_on:
      - mongo

  mongo:
    image: mongo:6
    container_name: epilanka-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
