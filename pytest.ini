[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Rich verbose output
addopts =
    -v
    -ra
    --strict-markers
    --tb=short
    --durations=10
    --durations-min=0.5

# Test markers for categorization
markers =
    unit: Unit tests for individual functions
    integration: Integration tests for endpoints
    slow: Tests that take a long time to run
    error_handling: Tests for error cases and edge conditions

